name: Build Frontend Docker

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_AUTH_API_URL: /auth
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '695451075871-jtr8p39l8dm7inm3bgmiqb2p912fg9o3.apps.googleusercontent.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate public build configuration
        run: test -n "$NEXT_PUBLIC_GOOGLE_CLIENT_ID"
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  build-and-push:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_AUTH_API_URL=/auth
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID || '695451075871-jtr8p39l8dm7inm3bgmiqb2p912fg9o3.apps.googleusercontent.com' }}
          tags: |
            ghcr.io/minhtri2702/mot-frontend:latest
            ghcr.io/minhtri2702/mot-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, mot-production]
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy frontend
        working-directory: /duong-dan-toi-thu-muc-Mot
        env:
          MOT_FRONTEND_IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose pull frontend
          docker compose up -d --no-deps frontend
