name: Build Frontend Docker

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  build-and-push:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_AUTH_API_URL=/auth
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID || '695451075871-jtr8p39l8dm7inm3bgmiqb2p912fg9o3.apps.googleusercontent.com' }}
          tags: |
            ghcr.io/minhtri2702/mot-frontend:latest
            ghcr.io/minhtri2702/mot-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
