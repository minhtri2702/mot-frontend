name: Build Frontend Docker

on:
  push:
    branches:
      - master

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            --build-arg NEXT_PUBLIC_AUTH_API_URL=/auth \
            -t ghcr.io/minhtri2702/mot-frontend:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/minhtri2702/mot-frontend:latest